# Example hosted SETools MCP server using an existing Azure CLI identity.

[server]
transport = http
name = setools
# default_policy = /srv/selinux/policy.bin
# instructions = Deployment-specific instructions.
host = 0.0.0.0
port = 8000
path = /mcp
health_path = /health
readiness_path = /ready
allow_local_paths = false
host_origin_protection = true
allowed_hosts = setools.example.com
allowed_origins = https://setools.example.com
max_policy_versions = 4
max_session_artifacts = 8
max_query_results = 1000
max_analysis_depth = 10
# The launcher has no authentication provider, so this server refuses to start unless it is
# embedded by a host that injects one, or an authenticating reverse proxy restricts access:
# allow_unauthenticated = true

[policy_provider]
type = azure_devops

[policy_provider.azure_devops]
organization = https://dev.azure.com/example
project = SELinux
scope = project
feed = policies
package = compiled-policy
policy_file = policy/policy.bin
file_contexts_file = policy/file_contexts
authentication = existing
